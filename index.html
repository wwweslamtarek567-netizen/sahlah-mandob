<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة مندوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#FFF6EE;min-height:100vh}
.header{background:#FF6A00;border-radius:0 0 22px 22px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.header h1{font-size:26px;font-weight:900}
.main{padding:12px;max-width:400px;margin:0 auto}
.hero{position:relative;width:100%;height:340px;background:#eee;border-radius:22px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;left:10px;right:10px;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.b1{background:#FFD400;color:#111;padding:10px 18px;border-radius:14px;font-weight:900;font-size:18px;box-shadow:3px 3px 0 #111}
.b2{background:#FF6A00;color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;width:100%;text-align:center}
.b3{background:#111;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:800}
.b3 span{color:#FF6A00}
.features{margin-top:12px;background:#fff;border:2px solid #FFE0BF;border-radius:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 6px}
.feat{text-align:center}
.ic{width:44px;height:44px;background:#FFF1E0;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:20px}
.feat p{font-size:10px;font-weight:800;line-height:1.2}
.btn{display:block;margin-top:14px;background:#111;color:#fff;text-align:center;padding:16px;border-radius:16px;font-weight:900;font-size:17px;text-decoration:none}
</style>
</head>
<body>
<div class="header"><span>☰</span><h1>ـ سهلة مندوب</h1><span></span></div>
<div class="main">
<div class="hero">
<img src="hero.jpg" alt="صورة سهلة مندوب">
<div class="badges">
<div class="b1">💪 سجل واشتغل حالا</div>
<div class="b2">مطلوب مناديب: ربع نقل / تمناية / تروسيكل</div>
<div class="b3">في <span>سهله</span> - دخل يومي</div>
</div>
</div>

<div class="features">
<div class="feat"><div class="ic">📞</div><p>دعم فني<br>24 ساعة<br>في كل<br>مصر</p></div>
<div class="feat"><div class="ic">🛻</div><p>نقبل ربع<br>نقل<br>تمناية<br>تروسيكل</p></div>
<div class="feat"><div class="ic">📍</div><p>اشتغل في<br>محافظتك<br>ومكانك</p></div>
<div class="feat"><div class="ic">💰</div><p>دخل يومي<br>مضمون<br>وعمولة<br>عالية</p></div>
</div>

<a class="btn" href="register.html">🚚 سجل كمندوب الآن</a>
</div>
</body>
  </html>
