*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#FFF6EE}

.feat{text-align:center}
.ic{width:50px;height:50px;background:#FFF1E0;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:24px}
.feat p{font-size:11px;font-weight:800;line-height:1.15}
.btns{margin-top:16px;display:grid;gap:10px}
.btn{display:block;text-align:center;text-decoration:none;padding:16px;border-radius:16px;font-weight:900;font-size:18px}
.btn1{background:#111;color:#fff}
.btn2{background:#FFD400;color:#000;border:2px solid #111}
